<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Lead Finder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="toolbar top">
    <div class="top-actions">
      <button type="button" id="start" class="start" disabled>Начать поиск</button>
      <button type="button" id="reset-memory" class="ghost">Сбросить память</button>
      <button type="button" id="show-browser" class="ghost">Показать браузер</button>
      <div class="exports">
        <button type="button" id="export-csv" class="ghost">CSV</button>
        <button type="button" id="export-xlsx" class="ghost">Excel</button>
        <button type="button" id="clear-leads" class="ghost">Очистить лидов</button>
      </div>
    </div>
  </header>

  <section class="panel controls">
    <div class="panel-title">Настройки</div>
    <div class="panel-body">
      <label class="field">
        <span>Сайт</span>
        <select id="site"></select>
      </label>
      <div class="field country-field">
        <span>Страна</span>
        <div class="combo" id="country-combo">
          <input id="country-input" type="text" placeholder="Найти страну" autocomplete="off" spellcheck="false" />
          <ul id="country-list" class="country-list" hidden></ul>
        </div>
      </div>
      <label class="field">
        <span>Стаж</span>
        <select id="experience">
          <option value="">Любой</option>
          <option value="Less than a year">Менее года и больше</option>
          <option value="1-3 years">1–3 года и больше</option>
          <option value="3-5 years">3–5 лет и больше</option>
          <option value="More than 5 years">Более 5 лет</option>
        </select>
      </label>
      <label class="field proxy-field">
        <span>Прокси</span>
        <input id="proxy-input" type="text" placeholder="socks5://host:port" autocomplete="off" spellcheck="false" />
      </label>
      <button type="button" id="proxy-check" class="ghost">Проверить</button>
      <p id="proxy-note" class="note"></p>
    </div>
  </section>

  <section class="panel terminal">
    <div class="tabs" role="tablist">
      <span class="tab" role="tab" aria-selected="true">Лиды</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Ник</th>
            <th>Страна</th>
            <th>Источник</th>
            <th>Активность</th>
            <th>Онлайн</th>
            <th>Регистрация</th>
            <th>Стаж</th>
            <th class="num">Прирост</th>
            <th class="num">Просадка</th>
            <th class="num">Сделки</th>
            <th>Найден</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty">Пока пусто. Подходящие профили появятся здесь по ходу поиска.</p>
    </div>
  </section>

  <footer class="metrics" id="status" aria-live="polite">
    <p id="status-line">Выберите страну и нажмите «Начать поиск».</p>
    <span>Запросы <strong id="m-requests">0</strong></span>
    <span>Профили <strong id="m-profiles">0</strong></span>
    <span>Лиды <strong id="m-leads">0</strong></span>
    <span>Источник <strong id="m-source">—</strong></span>
  </footer>

  <script src="renderer.js"></script>
</body>
</html>
